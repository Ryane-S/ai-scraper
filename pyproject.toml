[project]
name = "ai-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bs4>=0.0.2",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "ruff>=0.16.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "torch>=2.14.0",
    "trafilatura>=2.2.0",
    "transformers>=5.17.0",
    "uvicorn>=0.52.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff.lint]
ignore = ["BLE001", "B008", "DTZ005"]

[tool.mypy]
ignore_missing_imports = true